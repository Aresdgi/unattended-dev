<text x="270.0" y="884.0" text-anchor="middle" font-size="25" font-weight="700" fill="#e5e7eb">queue.sh done</text>
<text x="270.0" y="914.0" text-anchor="middle" font-size="19" fill="#a5adc0">DONE + commit, de una vez</text>
<rect x="580" y="40" width="290" height="100" rx="50.0" fill="#a5adc0" fill-opacity=".13" stroke="#a5adc0" stroke-width="2.5"/>
<text x="725.0" y="99.0" text-anchor="middle" font-size="25" font-weight="700" fill="#e5e7eb">Fin</text>
