<text x="286.0" y="657.0" text-anchor="start" font-size="19" font-weight="600" fill="#4ade80">verde</text>
<path d="M270.0,782 L270.0,836" fill="none" stroke="#4ade80" stroke-width="2.5" marker-end="url(#m-green)"/>
<text x="286.0" y="817.0" text-anchor="start" font-size="19" font-weight="600" fill="#4ade80">PASS</text>
<path d="M472,90.0 L576,90.0" fill="none" stroke="#a5adc0" stroke-width="2.5" marker-end="url(#m-muted)"/>
<text x="525.0" y="78.0" text-anchor="middle" font-size="17" font-weight="600" fill="#a5adc0">cola vacía</text>
<path d="M472,410.0 L725.0,410.0 L725.0,516" fill="none" stroke="#f87171" stroke-width="2.5" marker-end="url(#m-red)"/>
<text x="717.0" y="396.0" text-anchor="end" font-size="18" font-weight="600" fill="#f87171">fuera de tarea o timeout</text>
<path d="M472,556.0 L576,556.0" fill="none" stroke="#f87171" stroke-width="2.5" marker-end="url(#m-red)"/>
<text x="525.0" y="546.0" text-anchor="middle" font-size="17" font-weight="600" fill="#f87171">rojo</text>
<path d="M578,586.0 L474,586.0" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#m-amber)"/>
<text x="525.0" y="612.0" text-anchor="middle" font-size="17" font-weight="600" fill="#fbbf24">reintenta</text>
<path d="M472,730.0 L685.0,730.0 L685.0,624" fill="none" stroke="#f87171" stroke-width="2.5" marker-end="url(#m-red)"/>
<text x="490" y="718.0" text-anchor="start" font-size="19" font-weight="600" fill="#f87171">FAIL</text>
<path d="M765.0,622 L765.0,836" fill="none" stroke="#f87171" stroke-width="2.5" marker-end="url(#m-red)"/>
<text x="777.0" y="737.0" text-anchor="start" font-size="18" font-weight="600" fill="#f87171">sigue fallando</text>
