<text x="270.0" y="404.0" text-anchor="middle" font-size="25" font-weight="700" fill="#e5e7eb">Worker</text>
<text x="270.0" y="434.0" text-anchor="middle" font-size="19" fill="#a5adc0">solo sus archivos · tests en solo lectura</text>
<rect x="70" y="520" width="400" height="100" rx="18" fill="#fbbf24" fill-opacity=".13" stroke="#fbbf24" stroke-width="2.5"/>
<text x="270.0" y="564.0" text-anchor="middle" font-size="25" font-weight="700" fill="#e5e7eb">Gate</text>
<text x="270.0" y="594.0" text-anchor="middle" font-size="19" fill="#a5adc0">guardia · tests · build</text>
<rect x="70" y="680" width="400" height="100" rx="18" fill="#fbbf24" fill-opacity=".13" stroke="#fbbf24" stroke-width="2.5"/>
<text x="270.0" y="724.0" text-anchor="middle" font-size="25" font-weight="700" fill="#e5e7eb">QA</text>
<text x="270.0" y="754.0" text-anchor="middle" font-size="19" fill="#a5adc0">otro modelo, solo lectura</text>
