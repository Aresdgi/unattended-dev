name: scripts

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: for f in skills/unattended-dev/assets/desatendido/*.sh tests/run.sh; do bash -n "$f"; done
      - name: Scripts are executable
        run: test -z "$(find skills/unattended-dev/assets/desatendido -name '*.sh' ! -perm -u+x)"
      - name: Version is documented
        run: |
          v=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' .claude-plugin/plugin.json)
          grep -qF "## [$v] - " CHANGELOG.md
          grep -qF "## [$v] - " CHANGELOG.es.md
          grep -qF "badge/version-$v-" README.md
          grep -qF "badge/versión-$v-" README.es.md
          ! grep -rn "unattended-dev v[0-9]" skills/ | grep -vF "unattended-dev v${v%.*}"
      - name: Tests
        run: bash tests/run.sh

  # After the tests pass on main: a GitHub Release for every version in
  # CHANGELOG.md that does not have one yet, on the commit named
  # "unattended-dev X.Y.Z: ...". The version in plugin.json is the latest.
  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Releases from the changelog
        run: |
          current=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' .claude-plugin/plugin.json)
          for v in $(grep -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' CHANGELOG.md | tr -d '#[] ' | sort -V); do
            if gh release view "v$v" >/dev/null 2>&1; then continue; fi
            sha=$(git log --format=%H -F --grep="unattended-dev $v:" --reverse HEAD | head -1)
            if [ -z "$sha" ]; then echo "::warning::no commit 'unattended-dev $v:' for v$v"; continue; fi
            title=$(python3 .github/scripts/release_notes.py "$v" notes.md)
            latest=false; [ "$v" = "$current" ] && latest=true
            gh release create "v$v" --target "$sha" --title "$title" --notes-file notes.md --latest="$latest"
            echo "Released v$v on ${sha:0:7}"
          done
